# Alembic Configuration File

[alembic]
# Path to migration scripts
script_location = src/resalelens/migrations

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Max length of characters for revision id
truncate_slug_length = 40

# Version location specification
version_locations = %(here)s/src/resalelens/migrations/versions

# Output encoding
output_encoding = utf-8

# SQLAlchemy URL (overridden in env.py)
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Automatically format generated migration files with ruff
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
