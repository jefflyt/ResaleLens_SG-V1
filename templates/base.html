<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ResaleLens SG{% endblock %}</title>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/static/styles.css">

    {% block extra_head %}{% endblock %}
</head>

<body>
    <header>
        <nav class="container" role="navigation">
            <div class="nav-brand">
                <h1>ResaleLens SG</h1>
            </div>
            <button class="hamburger" aria-label="Toggle menu" onclick="toggleMobileMenu()">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/api/data-status">Data Status</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container">
        <p>&copy; 2026 ResaleLens SG. Built for Singapore's HDB community. | <a href="/api/data-status"
                style="color: #667eea; text-decoration: none;">Data Status</a></p>
    </footer>

    {% block scripts %}{% endblock %}

    <script>
        function toggleMobileMenu() {
            document.querySelector('.nav-links').classList.toggle('open');
        }
    </script>
</body>

</html>
